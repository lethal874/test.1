# Claude on GitHub: mention @claude in an issue, a comment, or a PR review
# and Claude Code answers, reviews, or pushes a fix to a new branch.
#
# Setup (once per repo):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add ONE secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses your
#      Claude Pro/Max plan) or ANTHROPIC_API_KEY (pay-per-use API key)
#   3. Add the repository variable CLAUDE_ENABLED = true
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      vars.CLAUDE_ENABLED == 'true' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 30
